<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Integridade</title>

<style>
:root{
    /* Paleta institucional CAESB (tons de azul) */
    --bg-app: #f2f6fa;
    --bg-card: #ffffff;
    --border-subtle: #d7e3ef;
    --text-primary: #0d2438;
    --text-secondary: #5b7690;
    --accent: #0072BC;
    --accent-dark: #00335B;
    --accent-mid: #3E9BE0;
    --accent-light: #8FC7EC;
    --accent-soft: #e7f2fb;
    --positive: #1f9e6d;
    --negative: #d64550;
    --radius-card: 10px;
    --shadow-card: 0 1px 2px rgba(0,51,91,.06);
    --ease: cubic-bezier(.22,.61,.36,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", "Inter", Arial, sans-serif;
    background: var(--bg-app);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
}

.dashboard{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ---------- HEADER ---------- */
.report-header{
    background: linear-gradient(90deg, var(--accent-dark), var(--accent));
    border-bottom: 1px solid var(--border-subtle);
    padding: 16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-box{
    width:36px;
    height:36px;
    border-radius:6px;
    background: rgba(255,255,255,.16);
    display:flex;
    align-items:center;
    justify-content:center;
    color: #ffffff;
    font-weight:700;
    font-size:14px;
    flex-shrink:0;
}

.header-titles h1{
    font-size:16px;
    font-weight:600;
    color: #ffffff;
}

.header-titles h2{
    font-size:12px;
    font-weight:400;
    color: rgba(255,255,255,.78);
    margin-top:2px;
}

/* ---------- FILTER BAR ---------- */
.filter-bar{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
}

.filter-group{
    display:flex;
    align-items:center;
    gap:8px;
}

.filter-group-label{
    font-size:11px;
    font-weight:600;
    color: rgba(255,255,255,.8);
    text-transform:uppercase;
    letter-spacing:.03em;
}

.year-pill{
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px 10px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:6px;
    font-size:12px;
    color: rgba(255,255,255,.85);
    cursor:pointer;
    background: rgba(255,255,255,.06);
    transition: all .18s var(--ease);
    user-select:none;
}

.year-pill:hover{
    background: rgba(255,255,255,.14);
    transform: translateY(-1px);
}

.year-pill input{
    display:none;
}

.year-pill .dot{
    width:8px;
    height:8px;
    border-radius:2px;
    background: rgba(255,255,255,.5);
    transition: background .18s var(--ease);
}

.year-pill.checked{
    border-color: #ffffff;
    color: #ffffff;
    background: rgba(255,255,255,.22);
    font-weight:600;
}

/* indicator select */
.indicator-select{
    font-size:12px;
    padding:6px 10px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:6px;
    background: rgba(255,255,255,.1);
    color: #ffffff;
    font-family:inherit;
    cursor:pointer;
    min-width:260px;
    transition: background .18s var(--ease), border-color .18s var(--ease);
}

.indicator-select:hover{
    background: rgba(255,255,255,.18);
}

.indicator-select option{
    color: var(--text-primary);
}

/* ---------- MAIN GRID ---------- */
.report-body{
    padding:20px 24px 32px;
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:1400px;
    width:100%;
    margin:0 auto;
}

.section-title{
    font-size:13px;
    font-weight:600;
    color: var(--text-primary);
}

/* KPI ROW */
.kpi-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
}

@keyframes kpiEnter{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
}

@keyframes kpiPulse{
    0%{ box-shadow: 0 0 0 0 rgba(0,114,188,.25); }
    100%{ box-shadow: 0 0 0 8px rgba(0,114,188,0); }
}

.kpi-card{
    background: var(--bg-card);
    border:1px solid var(--border-subtle);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding:14px 16px;
    animation: kpiEnter .45s var(--ease) both;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
}

.kpi-card:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,51,91,.1);
}

.kpi-card.pulse{
    animation: kpiPulse .5s var(--ease);
}

.kpi-label{
    font-size:11px;
    color: var(--text-secondary);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.03em;
    margin-bottom:6px;
}

.kpi-value{
    font-size:26px;
    font-weight:600;
    color: var(--accent-dark);
    line-height:1.1;
    font-variant-numeric: tabular-nums;
}

.kpi-sub{
    margin-top:6px;
    font-size:11px;
    color: var(--text-secondary);
    display:flex;
    align-items:center;
    gap:4px;
    animation: kpiEnter .35s var(--ease) both;
}

.kpi-sub.positive{ color: var(--positive); }
.kpi-sub.negative{ color: var(--negative); }

/* CHARTS ROW */
.charts-row{
    display:grid;
    grid-template-columns: 2fr 1fr;
    gap:14px;
    align-items:stretch;
}

.chart-card{
    background: var(--bg-card);
    border:1px solid var(--border-subtle);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding:16px 18px 12px;
    display:flex;
    flex-direction:column;
    transition: box-shadow .18s var(--ease);
}

.chart-card-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
}

.chart-card-title{
    font-size:13px;
    font-weight:600;
    color: var(--text-primary);
}

.chart-card-formula{
    font-size:11px;
    color: var(--text-secondary);
    transition: opacity .2s var(--ease);
}

/* legend */
.legend{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:10px;
    min-height: 14px;
}

@keyframes legendEnter{
    from{ opacity:0; transform: translateX(-4px); }
    to{ opacity:1; transform: translateX(0); }
}

.legend-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color: var(--text-secondary);
    animation: legendEnter .3s var(--ease) both;
}

.legend-swatch{
    width:9px;
    height:9px;
    border-radius:2px;
}

/* main bar chart */
.main-chart{
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    height:230px;
    border-bottom:1px solid var(--border-subtle);
    padding:0 8px;
    position:relative;
}

.main-chart::before{
    content:"";
    position:absolute;
    inset:0 8px auto 8px;
    height:1px;
}

.quarter-group{
    display:flex;
    align-items:flex-end;
    gap:5px;
    position:relative;
    min-width:70px;
    justify-content:center;
    height:100%;
}

.dynamic-bar{
    height: 0;
    border-radius: 6px 6px 0 0;
    transform-origin: bottom center;

    transition:
        height .9s cubic-bezier(.2,.8,.2,1),
        width .35s cubic-bezier(.2,.8,.2,1),
        transform .25s cubic-bezier(.2,.8,.2,1),
        filter .25s ease,
        box-shadow .25s ease;

    cursor: pointer;
    will-change: transform, height, filter;
}

/* Hover mais agressivo e “premium” */
.dynamic-bar:hover{
    filter: brightness(1.25) saturate(1.3);

    transform:
        scaleY(1.18)
        scaleX(1.22)
        translateY(-6px);

    box-shadow:
        0 0 0 2px rgba(255,255,255,.75) inset,
        0 10px 25px rgba(0,51,91,.35),
        0 0 18px rgba(0,150,255,.25);
}

.quarter-label{
    margin-top:8px;
    font-size:11px;
    color: var(--text-secondary);
    text-align:center;
}

.quarter-axis-labels{
    display:flex;
    justify-content:space-around;
    padding:0 8px;
}

.quarter-axis-labels span{
    min-width:70px;
    text-align:center;
    font-size:11px;
    color: var(--text-secondary);
}

/* variables horizontal chart */
.vars-chart{
    display:flex;
    flex-direction:column;
    gap:14px;
    justify-content:center;
    flex:1;
}

@keyframes rowEnter{
    from{ opacity:0; transform: translateX(-6px); }
    to{ opacity:1; transform: translateX(0); }
}

.h-row{
    display:flex;
    align-items:center;
    gap:10px;
    animation: rowEnter .35s var(--ease) both;
}

.h-label{
    width:26px;
    font-size:11px;
    color: var(--text-secondary);
    font-weight:600;
    flex-shrink:0;
}

.h-track{
    flex:1;
    background: var(--bg-app);
    border-radius:4px;
    height:16px;
    position:relative;
    overflow:hidden;
}

.h-bar{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--accent-mid), var(--accent));
    border-radius:4px;
    cursor:pointer;
    transform-origin: left center;
    transition: width .6s var(--ease), transform .25s var(--ease), filter .25s var(--ease);
}

.h-bar:hover{
    filter: brightness(1.15) saturate(1.1);
    transform: scaleY(1.15);
}

.h-value{
    width:38px;
    font-size:11px;
    color: var(--text-secondary);
    text-align:right;
    flex-shrink:0;
}

/* TABLE */
.table-card{
    background: var(--bg-card);
    border:1px solid var(--border-subtle);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding:16px 18px;
}

.table-card-title{
    font-size:13px;
    font-weight:600;
    margin-bottom:12px;
}

table.data-table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

.data-table thead th{
    text-align:left;
    font-size:11px;
    font-weight:600;
    color: var(--text-secondary);
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:8px 10px;
    border-bottom:1px solid var(--border-subtle);
}

.data-table thead th.num,
.data-table tbody td.num{
    text-align:right;
}

@keyframes tableRowEnter{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
}

.data-table tbody tr{
    animation: tableRowEnter .3s var(--ease) both;
    transition: background .15s var(--ease);
}

.data-table tbody td{
    padding:8px 10px;
    border-bottom:1px solid var(--border-subtle);
    color: var(--text-primary);
}

.data-table tbody tr:hover{
    background: var(--accent-soft);
}

.data-table tbody tr:last-child td{
    border-bottom:none;
}

.year-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:600;
}

.year-chip .dot{
    width:8px;
    height:8px;
    border-radius:2px;
}

/* TOOLTIP ESTILO POWER BI */
.tooltip {
    position: fixed;
    background: #ffffff;
    color: var(--text-primary);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    pointer-events: none;
    z-index: 1000;
    display: none;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,51,91,.16);
    border: 1px solid var(--border-subtle);
    opacity: 0;
    transform: translateY(4px) scale(.97);
    transition: opacity .12s var(--ease), transform .12s var(--ease);
}

.tooltip.visible{
    opacity: 1;
    transform: translateY(0) scale(1);
}

.tooltip .tt-title{
    font-weight:600;
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:6px;
    color: var(--text-primary);
}

.tooltip .tt-row{
    color: var(--text-secondary);
}

.tooltip .tt-row b{
    color: var(--text-primary);
}

.tooltip .tt-swatch{
    width:9px;
    height:9px;
    border-radius:2px;
    display:inline-block;
}

@media (max-width: 900px){
    .kpi-row{ grid-template-columns: repeat(2, 1fr); }
    .charts-row{ grid-template-columns: 1fr; }
}

/* ---------- VISUAL TOOLBAR (estilo Power BI) ---------- */
.chart-card-header{
    position:relative;
}

.visual-toolbar{
    display:flex;
    align-items:center;
    gap:4px;
    opacity:0;
    transform: translateY(-2px);
    transition: opacity .15s var(--ease), transform .15s var(--ease);
}

.chart-card:hover .visual-toolbar,
.visual-toolbar.menu-open{
    opacity:1;
    transform: translateY(0);
}

.toolbar-btn{
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:transparent;
    border-radius:5px;
    color: var(--text-secondary);
    cursor:pointer;
    transition: background .15s var(--ease), color .15s var(--ease);
}

.toolbar-btn:hover{
    background: var(--accent-soft);
    color: var(--accent);
}

.toolbar-btn svg{
    width:15px;
    height:15px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
}

/* dropdown menu */
.visual-menu{
    position:absolute;
    top:34px;
    right:16px;
    min-width:240px;
    background: var(--bg-card);
    border:1px solid var(--border-subtle);
    border-radius:8px;
    box-shadow: 0 8px 24px rgba(0,51,91,.16);
    padding:6px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transform: translateY(-6px) scale(.98);
    transition: opacity .14s var(--ease), transform .14s var(--ease);
}

.visual-menu.open{
    opacity:1;
    pointer-events:auto;
    transform: translateY(0) scale(1);
}

.visual-menu-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    font-size:13px;
    color: var(--text-primary);
    border-radius:5px;
    cursor:pointer;
    transition: background .12s var(--ease);
    position:relative;
}

.visual-menu-item:hover{
    background: var(--accent-soft);
}

.visual-menu-item svg{
    width:15px;
    height:15px;
    flex-shrink:0;
    fill:none;
    stroke: var(--text-secondary);
    stroke-width:1.6;
}

.visual-menu-item .check{
    width:14px;
    flex-shrink:0;
    color: var(--accent);
    font-size:12px;
}

.visual-menu-item .chevron{
    margin-left:auto;
    color: var(--text-secondary);
    font-size:11px;
}

.visual-menu-item.danger:hover{
    background: #fdeceb;
}

.visual-menu-item.danger:hover svg,
.visual-menu-item.danger:hover span{
    color: var(--negative);
    stroke: var(--negative);
}

.visual-menu-divider{
    height:1px;
    background: var(--border-subtle);
    margin:5px 4px;
}

.chart-card.visual-hidden .main-chart,
.chart-card.visual-hidden .vars-chart,
.chart-card.visual-hidden .legend,
.chart-card.visual-hidden .quarter-axis-labels{
    display:none;
}

.chart-card.visual-hidden::after{
    content:"Visual removido — clique para restaurar";
    display:block;
    text-align:center;
    padding:30px 0;
    font-size:12px;
    color: var(--text-secondary);
    cursor:pointer;
}
</style>
</head>

<body>
<div class="dashboard">

<header class="report-header">
    <div class="header-left">
        <div class="logo-box">PB</div>
        <div class="header-titles">
            <h1>Dashboard de Riscos de Integridade</h1>
            <h2>Indicadores de Integridade e Compliance · PRGA/PRTA</h2>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <span class="filter-group-label">Relatório</span>
            <select class="indicator-select" id="indicatorSelect"></select>
        </div>

        <div class="filter-group">
            <span class="filter-group-label">Ano</span>
            <label class="year-pill" data-year="2023">
                <input type="checkbox" class="year-checkbox" value="2023" checked>
                <span class="dot" style="background:#8FC7EC"></span>2023
            </label>
            <label class="year-pill" data-year="2024">
                <input type="checkbox" class="year-checkbox" value="2024">
                <span class="dot" style="background:#3E9BE0"></span>2024
            </label>
            <label class="year-pill" data-year="2025">
                <input type="checkbox" class="year-checkbox" value="2025">
                <span class="dot" style="background:#0072BC"></span>2025
            </label>
            <label class="year-pill" data-year="2026">
                <input type="checkbox" class="year-checkbox" value="2026">
                <span class="dot" style="background:#00335B"></span>2026
            </label>
        </div>
    </div>
</header>

<main class="report-body">

    <div class="kpi-row" id="kpiRow"></div>

    <div class="charts-row">
        <div class="chart-card">
            <div class="chart-card-header">
                <div>
                    <div class="chart-card-title" id="mainChartTitle">Evolução Trimestral</div>
                    <div class="chart-card-formula" id="formula"></div>
                </div>
                <div class="visual-toolbar" data-target="mainChart"></div>
            </div>
            <div class="legend" id="legend"></div>
            <div class="main-chart" id="mainChart"></div>
            <div class="quarter-axis-labels" id="quarterLabels"></div>
        </div>

        <div class="chart-card">
            <div class="chart-card-header">
                <div class="chart-card-title">Variáveis</div>
                <div class="visual-toolbar" data-target="varsChart"></div>
            </div>
            <div class="vars-chart" id="varsChart"></div>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-title">Detalhamento por Trimestre</div>
        <table class="data-table" id="dataTable">
            <thead>
                <tr>
                    <th>Ano</th>
                    <th>Trimestre</th>
                    <th class="num">Valor</th>
                    <th class="num">Var. vs Trim. anterior</th>
                </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
        </table>
    </div>

</main>

</div>

<!-- TOOLTIP GLOBAL, ESTILO POWER BI -->
<div class="tooltip" id="ttip"></div>

<script src="app.js"></script>
</body>
</html>
