<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Integridade - Caesb</title>
<link href="https://fonts.googleapis.com/css?family=Segoe+UI:400,600,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div class="dashboard">

<header class="report-header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='LOGO-CAESB-BRANCA-COMPLETA.png') }}" alt="CAESB" style="height:24px;display:block">
    </div>
    <div class="header-center">Dashboard de Riscos de Integridade</div>
    <div class="header-right">
        <span class="material-symbols-outlined info-icon">info</span>
    </div>
</header>

<div class="filter-bar">
    <div class="view-tabs">
        <button class="view-tab active" data-view="indicators">Indicadores</button>
        <button class="view-tab" data-view="risk-matrix">Matriz de Riscos</button>
    </div>

    <div class="filter-group" id="indicatorFilterGroup">
        <span class="filter-group-label">Indicador</span>
        <select class="indicator-select" id="indicatorSelect"></select>
    </div>

    <div class="filter-group" id="yearFilterGroup">
        <span class="filter-group-label">Ano</span>
        <label class="year-pill" data-year="2023">
            <input type="checkbox" class="year-checkbox" value="2023" checked>
            <span class="dot" style="background:#cccccc"></span>2023
        </label>
        <label class="year-pill" data-year="2024">
            <input type="checkbox" class="year-checkbox" value="2024">
            <span class="dot" style="background:var(--navy)"></span>2024
        </label>
        <label class="year-pill" data-year="2025">
            <input type="checkbox" class="year-checkbox" value="2025">
            <span class="dot" style="background:var(--sky)"></span>2025
        </label>
        <label class="year-pill" data-year="2026">
            <input type="checkbox" class="year-checkbox" value="2026">
            <span class="dot" style="background:#333333"></span>2026
        </label>
    </div>
</div>

<main class="report-body">

    <div id="indicatorsContent">
    <div class="kpi-row" id="kpiRow"></div>

    <div class="charts-row-full">
        <div class="chart-card">
            <div class="chart-card-header-top">
                <div>
                    <div class="chart-card-title" id="mainChartTitle">Evolução Histórica</div>
                    <div class="chart-card-formula" id="formula"></div>
                    <div class="meta-info" id="metaInfo"></div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div class="semaforo-badge neutro" id="semaforo"></div>
                    <div class="visual-toolbar" data-target="mainChart"></div>
                </div>
            </div>
            <div class="legend" id="legend"></div>
            <div class="main-chart" id="mainChart"></div>
            <div class="quarter-axis-labels" id="quarterLabels"></div>
        </div>
    </div>

    <div class="charts-row-half">
        <div class="chart-card">
            <div class="chart-card-header">
                <div class="chart-card-title">Variáveis (último período disponível)</div>
                <div class="visual-toolbar" data-target="varsChart"></div>
            </div>
            <div class="vars-chart" id="varsChart"></div>
        </div>

        <div class="chart-card">
            <div class="chart-card-header">
                <div class="chart-card-title">Comparativo Geral de Indicadores (último período)</div>
                <div class="visual-toolbar" data-target="indicesChart"></div>
            </div>
            <div class="vars-chart" id="indicesChart"></div>
        </div>
    </div>

    <div class="charts-row-half" id="secondaryRow">
        <div class="chart-card">
            <div class="chart-card-header">
                <div class="chart-card-title">Qualidade do Dado</div>
            </div>
            <div id="qualidadeBody"></div>
        </div>

        <div class="chart-card">
            <div class="chart-card-header">
                <div class="chart-card-title">Metodologia &amp; Observações</div>
            </div>
            <div id="metodologiaBody"></div>
        </div>
    </div>

    <div class="table-card">
        <div class="table-card-title">Detalhamento por Período</div>
        <table class="data-table" id="dataTable">
            <thead>
                <tr>
                    <th>Ano</th>
                    <th id="periodHeader">Período</th>
                    <th class="num">Valor</th>
                    <th class="num">Var. vs período anterior</th>
                    <th>Status da coleta</th>
                </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
        </table>
    </div>


    </div>

    <div class="risk-matrix-section" id="riskMatrixSection">
        <div id="riskMatrixBody"></div>
    </div>

</main>

</div>

<div class="tooltip" id="ttip"></div>

<link rel="stylesheet" href="{{ url_for('static', filename='risk-matrix/riskMatrix.css') }}">
<script src="{{ url_for('static', filename='js/model.js') }}"></script>
<script src="{{ url_for('static', filename='js/view.js') }}"></script>
<script src="{{ url_for('static', filename='risk-matrix/riskMatrix.js') }}"></script>
<script src="{{ url_for('static', filename='risk-matrix/riskMatrix.render.js') }}"></script>
<script src="{{ url_for('static', filename='js/controller.js') }}"></script>
</body>
</html>
